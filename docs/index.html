<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PeerSitter</title>
<style>
  :root { color-scheme: dark light; --bg:#0f1115; --fg:#e7e9ee; --muted:#8b90a0; --accent:#4f8cff; --card:#181b22; --border:#262b36; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height:1.6; }
  main { max-width: 560px; margin: 0 auto; padding: 64px 20px; text-align: center; }
  a { color: var(--accent); }
  h1 { font-size: 2rem; margin-bottom: 8px; }
  p.subtitle { color: var(--muted); margin-bottom: 32px; }
  .links { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .links a { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 20px; text-decoration: none; width: 220px; }
  .links a:hover { border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>PeerSitter</h1>
  <p class="subtitle">Open-source, peer-to-peer camera monitoring. No cloud, no account, no cost.</p>
  <div class="links">
    <a href="https://github.com/lcsvcn/peersitter">Source code on GitHub</a>
    <a href="./privacy.html">Privacy Policy</a>
    <a href="./terms.html">Terms of Use</a>
  </div>
</main>
</body>
</html>
