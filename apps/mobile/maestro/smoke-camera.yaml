appId: dev.peersitter.app
name: "PeerSitter: Camera role smoke test"
---
# Note: WebView accessibility merges each card's title + description into a
# single accessible label, so cards are matched by regex rather than the
# visible title text alone. `stopApp` before `launchApp` is required: this
# is a single-page app with in-memory navigation state (no router), and
# without a hard kill the WKWebView process can survive `launchApp`'s
# clearState, leaving the app on whatever screen a previous run left it on.
- stopApp
- launchApp:
    clearState: true
    permissions:
      camera: allow
      microphone: allow

- extendedWaitUntil:
    visible: "PeerSitter"
    timeout: 10000
- assertVisible: ".*Be a Camera.*"
- takeScreenshot: "01-home"

- tapOn: ".*Be a Camera.*"
- assertVisible: "Camera"
# The QR code section pushes the motion-recording controls below the
# fold on smaller viewports — scroll rather than assertVisible directly,
# since off-screen content isn't present in the accessibility snapshot
# assertVisible/extendedWaitUntil read from (confirmed via inspect_screen
# reporting "2 pages" of vertical scroll on this screen).
- scrollUntilVisible:
    element: ".*Record automatically when this camera sees movement.*"
    direction: DOWN
    timeout: 10000
- takeScreenshot: "02-camera"

# Scroll back up — the previous step scrolled down to reach the motion
# controls, which pushes "← Back" at the top off-screen.
- scrollUntilVisible:
    element: "← Back"
    direction: UP
    timeout: 10000
# retryTapIfNoChange must be false here: the camera screen's live motion
# timer keeps the hierarchy constantly changing, which confuses Maestro's
# default no-change-retry heuristic into never registering the tap.
- tapOn:
    text: "← Back"
    retryTapIfNoChange: false
- assertVisible: "PeerSitter"
