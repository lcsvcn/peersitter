appId: dev.peersitter.app
name: "PeerSitter: named Camera ready to be watched (multi-device)"
---
# Part of the multi-device run (see multi-device.sh). The runner wipes app
# data and grants camera/mic at the OS level first, because `clearState`
# here would also reset those grants. Env: NAME (shown on every viewer's tile), SIGNAL_URL (ws:// URL of the relay).
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "PeerSitter"
    timeout: 30000
- tapOn: ".*Settings.*"
- scrollUntilVisible:
    element: "Camera name"
    direction: DOWN
    timeout: 30000
- tapOn: "Camera name"
- eraseText
- inputText: ${NAME}
- hideKeyboard
# Point this camera at the test relay (the default port may be taken on a dev machine).
- scrollUntilVisible:
    element: "ws://localhost:8787"
    direction: DOWN
    timeout: 30000
- tapOn: "ws://localhost:8787"
- eraseText
- inputText: ${SIGNAL_URL}
- tapOn: "Signaling server"
- scrollUntilVisible:
    element: ".*Be a Camera.*"
    direction: UP
    timeout: 30000
- tapOn: ".*Be a Camera.*"
- assertVisible: ${NAME}
# The status line sits below the QR code, off-screen on a phone (and
# off-screen elements aren't in the accessibility snapshot), so wait on the
# pairing prompt instead: it only shows once the room exists.
- extendedWaitUntil:
    visible: "Scan this on a Viewer device.*"
    timeout: 60000
# Expand the code fallback so the runner can read the pairing code from the
# accessibility tree (no QR scanning between two virtual devices).
- scrollUntilVisible:
    element: ".*Copy the pairing code.*"
    timeout: 15000
- tapOn: ".*Copy the pairing code.*"
